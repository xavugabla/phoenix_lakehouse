# Welcome to your prefect.yaml file! You can use this file for storing and managing
# your flow deployments. By committing this file to your repository, you can trigger
# new deployments when you push your code.
#
# For more information, see https://docs.prefect.io/latest/concepts/deployments/

# This section defines the command to run to build your deployment.
# For Docker-based deployments, this will be a `docker build` command.
build:
  # The module to import to find your flow.
  - prefect.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker
      image_name: data-pipeline-image
      tag: latest
      dockerfile: auto  # Use auto-discovery for the Dockerfile

# This section defines the command to run to push your deployment.
# For Docker-based deployments, this will be a `docker push` command.
push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

# This section defines your deployments.
deployments:
- name: cenace-daily-production
  description: Daily CENACE data pipeline - runs at 2 AM UTC.
  entrypoint: orchestration/flows/cenace_daily.py:cenace_daily_flow
  work_pool:
    name: default-agent-pool
  schedule:
    cron: "0 2 * * *"
    timezone: UTC
  parameters:
    regions:
    - SIN
    markets:
    - MDA
    - MTR
    datasets:
    - pend
    - psc
  tags:
  - production
  - daily
  - cenace

- name: cenace-extract-only
  description: Extraction-only flow for ad-hoc data collection. Supports PML, PEND, and PSC datasets.
  entrypoint: orchestration/flows/extract_only.py:extract_only_flow
  work_pool:
    name: default-agent-pool
  parameters: {}
  tags:
  - ad-hoc
  - extraction

- name: cenace-backfill
  description: Backfill flow for historical data collection with GCS upload and duplicate checking.
  entrypoint: orchestration/flows/backfill.py:backfill_flow
  work_pool:
    name: default-agent-pool
  parameters:
    chunk_days: 7
  tags:
  - backfill
  - historical
