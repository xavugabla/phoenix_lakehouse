# Lakehouse Platform Configuration
# This file defines the storage layout, catalog, and table contracts

bucket: "novagrid-lakehouse"
prefix: ""  # Optional prefix for organization (e.g., "prod/", "dev/")
warehouse: "gs://novagrid-lakehouse/"

zones:
  raw: "raw"
  bronze: "bronze"
  silver: "silver"
  gold: "gold"

catalog:
  type: "sql"
  uri: "sqlite:///iceberg_catalog.db"  # SQLite database path (can be absolute or relative)
  warehouse: "gs://novagrid-lakehouse/"  # GCS path for table data storage

# Legacy bucket (read-only archive)
legacy:
  bucket: "lakehouse_phoenix"
  warehouse: "gs://lakehouse_phoenix/"

# Table contracts can be defined here OR in modular files (configs/tables/*.yaml)
# Modular files are recommended for better organization as domains grow
tables: {}
# Example (inline):
# tables:
#   bronze.example_table:
#     domain: "example"
#     zone: "bronze"
#     schema: "example_table_bronze"
#     partition_by: ["partition_key1", "partition_key2"]